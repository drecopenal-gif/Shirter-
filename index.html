<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Link Shortener</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7fb;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #222;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }

    input:focus {
      border-color: #4f46e5;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    .result {
      display: none;
      margin-top: 25px;
    }

    .result label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    .short-row {
      display: flex;
      gap: 8px;
    }

    .short-row input {
      margin: 0;
      background: #f8f8f8;
    }

    .copy-btn {
      width: 100px;
      background: #16a34a;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background: #15803d;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      color: #16a34a;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🔗 Link Shortener</h1>
    <p class="subtitle">Paste your original link below</p>

    <input
      type="url"
      id="originalLink"
      placeholder="https://example.com/your-long-link"
    >

    <button onclick="shortenLink()">Shorten Link</button>

    <div class="result" id="result">
      <label>Short Link</label>

      <div class="short-row">
        <input type="text" id="shortLink" readonly>
        <button class="copy-btn" onclick="copyLink()">Copy</button>
      </div>

      <p class="message" id="message"></p>
    </div>
  </div>

  <script>
    function shortenLink() {
      const original = document.getElementById("originalLink").value.trim();
      const result = document.getElementById("result");
      const shortLink = document.getElementById("shortLink");
      const message = document.getElementById("message");

      if (!original) {
        alert("Please enter a link.");
        return;
      }

      try {
        new URL(original);
      } catch {
        alert("Please enter a valid URL.");
        return;
      }

      // Random short code
      const code = Math.random().toString(36).substring(2, 8);

      // Demo short URL
      const shortURL = window.location.origin + "/s/" + code;

      shortLink.value = shortURL;
      result.style.display = "block";
      message.textContent = "Short link generated!";
    }

    function copyLink() {
      const shortLink = document.getElementById("shortLink");
      const message = document.getElementById("message");

      navigator.clipboard.writeText(shortLink.value)
        .then(() => {
          message.textContent = "✅ Link copied!";
        })
        .catch(() => {
          shortLink.select();
          document.execCommand("copy");
          message.textContent = "✅ Link copied!";
        });
    }
  </script>

</body>
</html>
